services:
  # ---------------------------------------------------------------------------
  # 1. PHP Application Service (PHP 8.2 + Apache)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmadem_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: employee_management_db
      DB_USER: root
      DB_PASS: root_secret_123
      DB_CHARSET: utf8mb4
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      APP_NAME: "Employee Daily Work & Evaluation System (Docker)"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pharmadem_net

  # ---------------------------------------------------------------------------
  # 2. Database Service (MySQL 8.0)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: pharmadem_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_123
      MYSQL_DATABASE: employee_management_db
    volumes:
      - pharmadem_db_data:/var/lib/mysql
      # Auto-import schema, tables, foreign keys, indexes, and initial seeds on first launch
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_secret_123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pharmadem_net

  # ---------------------------------------------------------------------------
  # 3. Database Management UI (phpMyAdmin)
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pharmadem_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_secret_123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pharmadem_net

# -----------------------------------------------------------------------------
# Persistent Volumes & Custom Network
# -----------------------------------------------------------------------------
volumes:
  pharmadem_db_data:
    driver: local

networks:
  pharmadem_net:
    driver: bridge
